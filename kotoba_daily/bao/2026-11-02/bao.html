  B.bai.forEach((b, i) => {
    const sec = el("article", "card art"); sec.lang = "ja";
    if (b.loai === "truyen" && b.ky) { const k = el("div", "kind", "Truyện dài kỳ, kỳ " + b.ky); k.lang = "vi"; sec.appendChild(k); }
    const h = el("h2"); h.appendChild(md(b.tieu_de, true)); sec.appendChild(h);
    if (b.ky_truoc) { const k = el("p", "prev", "Kỳ trước: " + b.ky_truoc); k.lang = "vi"; sec.appendChild(k); }
    b.doan.forEach((p, j) => {
      const para = el("p"); para.appendChild(md(p, true));
      const src = A.bai && A.bai[i] && A.bai[i][j];
      if (src) {
        const btn = el("button", "play", "▶"); btn.type = "button"; btn.setAttribute("aria-label", "Nghe đoạn này");
        btn.addEventListener("click", () => play(src)); para.appendChild(btn);
      }
      sec.appendChild(para);
    });
    if (b.nguon) {
      const s = el("p", "src"); s.lang = "vi"; s.appendChild(document.createTextNode("Viết lại từ tin: "));
      const a = el("a", null, b.nguon); a.href = b.nguon; a.target = "_blank"; a.rel = "noopener"; s.appendChild(a); sec.appendChild(s);
    }
    bai.appendChild(sec);
  });

  const info = $("info");
  function showWord(k) {
    const w = DATA.tu[k]; if (!w) return;
    info.textContent = "";
    info.appendChild(el("span", "big", w.w)); 
    if (w.r) info.appendChild(el("span", "ja", w.r + "  "));
    info.appendChild(document.createTextNode(w.m || ""));
    const note = w.moi ? "Từ mới trong số này." : (w.bai ? "Đã học ở " + w.bai + "." : "");
    if (note || w.quen) {
      info.appendChild(el("br"));
      info.appendChild(document.createTextNode(note + (w.quen ? " Bạn sắp quên từ này, báo cố ý nhắc lại." : "")));
    }
    document.querySelectorAll(".tu.chon").forEach((x) => x.classList.remove("chon"));
    document.querySelectorAll('.tu[data-k="' + CSS.escape(k) + '"]').forEach((x) => x.classList.add("chon"));
  }
  bai.addEventListener("click", (e) => { const t = e.target.closest(".tu"); if (t) showWord(t.dataset.k); });
  bai.addEventListener("keydown", (e) => { const t = e.target.closest(".tu"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showWord(t.dataset.k); } });

  $("furi").addEventListener("click", (e) => {
    document.body.classList.toggle("nofuri");
    e.currentTarget.textContent = document.body.classList.contains("nofuri") ? "Hiện furigana" : "Ẩn furigana";
  });

  const qBox = $("cauhoi"); const qDone = {};
  (B.cau_hoi || []).forEach((q, i) => {
    const wrap = el("div", "q");
    const hoi = el("p", "hoi"); hoi.lang = "ja"; hoi.appendChild(document.createTextNode((i + 1) + ". ")); hoi.appendChild(md(q.hoi, false)); wrap.appendChild(hoi);
    const fb = el("div", "fb"); fb.setAttribute("aria-live", "polite");
    q.chon.forEach((o, j) => {
      const btn = el("button", "opt"); btn.type = "button"; btn.lang = "ja"; btn.appendChild(md(o, false));
      btn.addEventListener("click", () => {
        wrap.querySelectorAll(".opt").forEach((x) => x.classList.remove("dung", "sai"));
        if (j === q.dung) {
          btn.classList.add("dung");
          if (!qDone[i]) { score++; showScore(); }
          qDone[i] = "ok"; fb.className = "fb ok"; fb.textContent = "Đúng. " + q.giai_thich;
        } else {
          btn.classList.add("sai"); if (!qDone[i]) qDone[i] = "sai";
          fb.className = "fb bad"; fb.textContent = "Chưa đúng, đọc lại bài rồi thử lần nữa.";
        }
      });
      wrap.appendChild(btn);
    });
    wrap.appendChild(fb); qBox.appendChild(wrap);
  });

  const cBox = $("chinhta"); const cDone = {};
  (B.chinh_ta || []).forEach((c, i) => {
    const wrap = el("div", "ct");
    const row1 = el("div", "row"); row1.appendChild(el("span", null, "Câu " + (i + 1)));
    const fb = el("div", "fb"); fb.setAttribute("aria-live", "polite");
    const audio = (A.chinh_ta && A.chinh_ta[i]) || {};
    const b1 = el("button", null, "Nghe"); b1.type = "button"; b1.addEventListener("click", () => play(audio.thuong, surface(c.cau), 0.95, fb));
    const b2 = el("button", null, "Nghe chậm"); b2.type = "button"; b2.addEventListener("click", () => play(audio.cham, surface(c.cau), 0.7, fb));
    row1.appendChild(b1); row1.appendChild(b2); wrap.appendChild(row1);
    const row2 = el("div", "row");
    const inp = el("input"); inp.type = "text"; inp.lang = "ja"; inp.placeholder = "Gõ câu vừa nghe"; inp.setAttribute("aria-label", "Câu " + (i + 1));
    const chk = el("button", null, "Kiểm tra"); chk.type = "button";
    row2.appendChild(inp); row2.appendChild(chk); wrap.appendChild(row2);
    const ans = el("div", "answer"); ans.lang = "ja";
    const accepted = [surface(c.cau), kana(c.cau)].concat(c.them_dap_an || []).map(norm);
    function check() {
      ans.textContent = "";
      if (!inp.value.trim()) { fb.className = "fb bad"; fb.textContent = "Gõ câu bạn nghe được trước đã."; return; }
      if (accepted.includes(norm(inp.value))) {
        fb.className = "fb ok"; fb.textContent = "Đúng rồi.";
        if (!cDone[i]) { cDone[i] = 1; score++; showScore(); }
      } else {
        fb.className = "fb bad"; fb.textContent = "Chưa đúng. Đáp án:"; ans.appendChild(md(c.cau, false));
      }
    }
    chk.addEventListener("click", check);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) check(); });
    inp.addEventListener("input", () => { if (fb.classList.contains("bad")) { fb.textContent = ""; ans.textContent = ""; } });
    wrap.appendChild(fb); wrap.appendChild(ans); cBox.appendChild(wrap);
  });

  const mBox = $("mau");
  (DATA.mau || []).forEach((g) => {
    const btn = el("button", "chip", g.mau); btn.type = "button";
    btn.addEventListener("click", () => { info.textContent = g.mau + ": " + g.nghia + (g.bai ? " (" + g.bai + ")" : ""); });
    mBox.appendChild(btn);
  });
  const credits = [];
  if (A.credit) credits.push("Giọng đọc: " + A.credit + ".");
  credits.push("Báo do Claude viết tự động, có thể còn chỗ chưa tự nhiên.");
  $("credit").textContent = credits.join(" ");
})();
</script>
</body>
</html>
