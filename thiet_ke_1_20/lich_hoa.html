<div id="kb-app">

<script>
"use strict";
const V = new URLSearchParams(location.search).get("v") || "month";

const PR = LONG === "en" ? {

        ["eats → ate", "Dạng chia · eat là động từ bất quy tắc: eat → ate."]],

  text: "きのうは雨だったので、友だちと駅の近くのレストランを予約しました。寒いでしたが、料理はおいしいでした。また行きたいです。",
  fixed: "きのうは雨だったので、友だちと駅の近くのレストランを<u>予約</u>しました。<mark>寒かったです</mark>が、料理は<mark>おいしかったです</mark>。また<mark>行きたいと思います</mark>。",

        ["行きたいです → 行きたいと思います", "Tự nhiên hơn · nói ý định với người khác nên thêm と思います."]],
  more: "",

};
const plen = (t) => PR.lang === "en" ? t.split(/\s+/).filter(Boolean).length : t.replace(/<[^>]+>/g, "").length;
const el = (t, c, s) => { const e = document.createElement(t); if (c) e.className = c; if (s !== undefined) e.textContent = s; return e; };
// ---- sprite pixel ----
function sprite(rows, pal, scale) {
  const cv = document.createElement("canvas");
  cv.width = rows[0].length * scale; cv.height = rows.length * scale;
  cv.style.imageRendering = "pixelated";
  const ctx = cv.getContext("2d");
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = pal[r[x]]; if (c) { ctx.fillStyle = c; ctx.fillRect(x * scale, y * scale, scale, scale); } } });
  return cv;
}
const FLOWER = [
  ["............", "............", "............", "............", "............", "............", "............", "............", "............", "............", "..bbbbbbbb..", ".bBbbBbbBbb."],

  ["............", ".....pp.....", "....pPPp....", "...pPyyPp...", "....pPPp....", ".....pp.....", "......g.....", "...gg.g.....", "....ggg.gg..", "......ggg...", "..bbbbbbbb..", ".bBbbBbbBbb."],
  ["...pp..pp...", "..pPPppPPp..", "..pPPyyPPp..", "...ppyyyp...", "..pPPyyPPp..", "..pPPppPPp..", "...pp.gpp...", "...gg.g.....", "....ggg.gg..", ".g....ggg...", "..bbbbbbbb..", ".bBbbBbbBbb."],
];
const THEME = {
  momiji: { name: "Mùa lá đỏ 紅葉", c: "#e85d04", p: "#ff8c42", P: "#d9452b" },
  xmas: { name: "Giáng sinh", c: "#2a9d8f", p: "#ffffff", P: "#e23b3b" },
  halloween: { name: "Halloween", c: "#7b2cbf", p: "#ffb347", P: "#7b2cbf" },
  oshogatsu: { name: "お正月", c: "#d62828" }, winter: { name: "Mùa đông", c: "#9ecbff" }, tet: { name: "Tết", c: "#ffcc00" },
  spring: { name: "Mùa xuân", c: "#ffb7c5" }, hanami: { name: "Hoa anh đào 花見", c: "#ff8fab" }, tsuyu: { name: "Mùa mưa 梅雨", c: "#6c8ebf" },
  tanabata: { name: "Thất Tịch 七夕", c: "#3d348b" }, summer: { name: "Mùa hè", c: "#ffd166" }, natsu: { name: "Lễ hội mùa hè", c: "#ef476f" },
  autumn: { name: "Mùa thu", c: "#e76f51" }, tsukimi: { name: "Trung thu", c: "#f4a261" },

// 1.20: hoa cùng kiểu cây của ruộng (seeds.js + loài mới ở flowers.js), mỗi giao diện mùa một loài
function flower(level, theme, scale) { return KB_FLOWER_ART.make(theme, level, scale >= 4 ? 3 : 2, level * 7 + theme.length); }
// sticker tâm trạng 9×9
const FACE = {
  vui: { c: "#ffd23f", r: ["..kkkkk..", ".kyyyyyk.", "kyykyykyk", "kyyyyyyyk", "kyyyyyyyk", "kykyyykyk", "kyykkkyyk", ".kyyyyyk.", "..kkkkk.."] },

const lvlOf = (n) => n === 0 ? 0 : n < 10 ? 1 : n < 30 ? 2 : n < 60 ? 3 : 4;
function panelTop(panel, tab, hud) {

  nav.appendChild(el("button", "kb-btn kb-btn-small", "▸"));
  L.appendChild(nav);
  const bands = el("div", "kb-cal-bands");
  [["momiji", "1/11 – 10/12", 1], ["xmas", "15/11 – 31/12 (ưu tiên hơn lá đỏ)", 1]].forEach((b) => {
    const r = el("div", "kb-cal-band"); const i = el("i"); i.style.background = THEME[b[0]].c; i.style.width = "28px";
    r.appendChild(i); r.appendChild(el("b", null, THEME[b[0]].name)); r.appendChild(el("span", null, b[1])); bands.appendChild(r);
